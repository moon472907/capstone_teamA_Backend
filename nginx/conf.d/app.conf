server {
    listen 80;
    server_name api.everyknu.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.everyknu.cloud;

    ssl_certificate /etc/letsencrypt/live/api.everyknu.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.everyknu.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Docker 내장 DNS로 app 컨테이너 IP를 주기적으로 재조회
    # (재배포로 app 컨테이너가 새 IP로 뜰 때 502 방지)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }
}
